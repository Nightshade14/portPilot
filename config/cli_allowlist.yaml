# config/cli_allowlist.yaml -- draft allow-list for spikes/s3/install.py.
#
# Schema:
#   tools:
#     <name>:                       # key = the only string install_cli_tool()/install.py accepts
#       version: "<upstream tag, no leading v>"
#       verify_command: "<cmd>"     # run after install; stdout+stderr must contain `version`
#       architectures:
#         amd64:
#           url: "<direct download URL for this arch>"
#           sha256: "<lowercase hex, copied verbatim from the project's own published
#                     checksums file -- never computed by the installer or by us>"
#           install_method: "binary" | "tarball:<path-to-binary-inside-the-archive>"
#         arm64:
#           ...same shape...
#
# "required" tools (trivy, hadolint, dive) had their arm64 sha256 independently
# re-verified by downloading the artifact and hashing it locally (see
# docs/spikes/S3_SANDBOX.md, goal 3) -- not just copied from the checksums file.
# "best effort" tools (syft, grype, dockle, crane, jq, yq, ripgrep) have sha256
# copied verbatim from the project's own checksums file/sidecar, not independently
# re-verified in this spike.
# shellcheck and buildkit publish NO sha256 checksums file for this release at all
# (buildkit ships only cosign/SLSA attestations) -- they are listed with
# sha256: null and are refused by install.py until a hash exists to pin against.

tools:
  trivy:
    version: "0.74.0"
    verify_command: "trivy --version"
    architectures:
      amd64:
        url: "https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz"
        sha256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        install_method: "tarball:trivy"
      arm64:
        url: "https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-ARM64.tar.gz"
        sha256: "b94ce1976bbf3c15b514b605ee88be7c6d94a29be2302847ff01cb794d47aad5"
        install_method: "tarball:trivy"

  hadolint:
