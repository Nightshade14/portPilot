[project]
name = "portpilot"
version = "0.1.0"
description = "Self-improving, Atlas-backed harness for behavior-preserving Flask -> Hono migration"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "strands-agents[openai]==1.57.1",
    "pymongo==4.18.2",
    "flask==3.1.3",
    "httpx==0.28.1",
    "typer==0.27.2",
    "rich==15.0.0",
    "python-dotenv==1.2.3",
]

[project.scripts]
portpilot = "portpilot.cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "atlas: needs PORTPILOT_TEST_MONGODB_URI (a disposable MongoDB; never production)",
    "llm: needs OPENROUTER_API_KEY (live model calls)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
