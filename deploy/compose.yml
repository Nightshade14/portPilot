# Caddy (TLS termination) and the rootless BuildKit sidecar (image builds for
# the sandbox's build_image tool). The API and worker are NOT here: they run
# on the host (systemd units in deploy/systemd/) because they drive the
# Docker CLI directly. The Docker socket is never mounted into any container,
# including these two.

services:
  caddy:
    image: caddy:2.10.2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PORTPILOT_DOMAIN=${PORTPILOT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  buildkitd:
    image: moby/buildkit:v0.20.2-rootless
    restart: always
    # Rootless BuildKit sidecar for `portpilot.sandbox.buildkit`. Bound to
    # localhost only: it is reached from the host (the worker process),
    # never from the public internet.
    ports:
      - "127.0.0.1:1234:1234"
    entrypoint:
      - rootlesskit
      - buildkitd
      - --addr
      - tcp://0.0.0.0:1234
    volumes:
      - buildkit_data:/home/user/.local/share/buildkit
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined

volumes:
  caddy_data:
  caddy_config:
  buildkit_data:
